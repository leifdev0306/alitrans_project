{% extends 'base.html' %}
{% block title %}Crear Correo - Alitrans{% endblock %}
{% block content %}
<h2 class="mb-4 fw-bold" style="color: var(--alitrans-dark);">
    <i class="bi bi-plus-circle me-2"></i>Crear Nuevo Correo
</h2>

<div class="table-container">
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">Asunto</label>
            <input type="text" name="asunto" class="form-control form-control-lg" placeholder="Ej: Oferta especial de transporte de carga" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Cuerpo del correo (HTML)</label>
            <textarea name="cuerpo" class="form-control" rows="10" placeholder="<h1>Oferta</h1><p>Contenido...</p>" required></textarea>
            <div class="form-text">Puedes usar etiquetas HTML para dar formato.</div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Destinatarios</label>
            <input type="text" name="destinatarios" class="form-control" placeholder="correo1@ejemplo.com, correo2@ejemplo.com">
            <div class="form-text">Separa los correos con comas. Si lo dejas vacío, se enviará a todos los suscritos.</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-alitrans">
                <i class="bi bi-save me-1"></i>Guardar Borrador
            </button>
            <a href="{% url 'frontend:lista_correos' %}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
