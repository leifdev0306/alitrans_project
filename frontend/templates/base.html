<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Alitrans - Gestión de Ofertas{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --alitrans-primary: #0B3D91;
            --alitrans-secondary: #1E5AA8;
            --alitrans-accent: #00A8E8;
            --alitrans-light: #F4F7FC;
            --alitrans-dark: #1A1A2E;
        }
        body {
            background-color: var(--alitrans-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .sidebar {
            background: linear-gradient(180deg, var(--alitrans-primary) 0%, var(--alitrans-secondary) 100%);
            min-height: 100vh;
            color: #fff;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 10px;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .sidebar .navbar-brand {
            color: #fff;
            font-weight: 700;
            font-size: 1.4rem;
            padding: 20px;
        }
        .card-stat {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(11, 61, 145, 0.08);
            transition: transform 0.3s;
        }
        .card-stat:hover {
            transform: translateY(-5px);
        }
        .card-stat .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
        }
        .btn-alitrans {
            background: var(--alitrans-primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 10px 24px;
            font-weight: 600;
        }
        .btn-alitrans:hover {
            background: var(--alitrans-secondary);
            color: #fff;
        }
        .table-container {
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(11, 61, 145, 0.06);
        }
        .badge-borrador { background: #6c757d; }
        .badge-programado { background: #ffc107; color: #000; }
        .badge-enviado { background: #198754; }
        .badge-fallido { background: #dc3545; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-2 sidebar d-flex flex-column p-0">
            <a class="navbar-brand" href="{% url 'frontend:dashboard' %}">
                <i class="bi bi-truck me-2"></i>Alitrans
            </a>
            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}" href="{% url 'frontend:dashboard' %}">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'correo' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'frontend:lista_correos' %}">
                        <i class="bi bi-envelope me-2"></i>Correos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'destinatario' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'frontend:lista_destinatarios' %}">
                        <i class="bi bi-people me-2"></i>Destinatarios
                    </a>
                </li>
                <li class="nav-item mt-3">
                    <a class="nav-link" href="/admin/">
                        <i class="bi bi-gear me-2"></i>Administración
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main content -->
        <main class="col-md-10 p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
