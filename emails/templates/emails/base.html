<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Alitrans{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --ali-primary: #0B3D91;
            --ali-secondary: #1E5AA8;
            --ali-accent: #00A8E8;
            --ali-light: #F4F7FC;
            --ali-dark: #1A1A2E;
        }
        body { background: var(--ali-light); font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; }
        .layout { display: flex; min-height: 100vh; }
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, var(--ali-primary) 0%, #082a66 100%);
            color: #fff; display: flex; flex-direction: column;
            position: fixed; top: 0; bottom: 0; left: 0; z-index: 100;
        }
        .sidebar-brand {
            padding: 22px 20px; font-size: 1.45rem; font-weight: 700;
            color: #fff; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 10px;
        }
        .sidebar-nav { padding: 14px 0; flex: 1; }
        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px;
            color: rgba(255,255,255,0.78); padding: 12px 22px;
            text-decoration: none; font-size: 0.96rem;
            border-left: 3px solid transparent; transition: all 0.2s;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            color: #fff; background: rgba(255,255,255,0.08);
            border-left-color: var(--ali-accent);
        }
        .sidebar-nav a i { font-size: 1.15rem; width: 20px; }
        .sidebar-footer {
            padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem; color: rgba(255,255,255,0.5);
        }
        .main-content { margin-left: 250px; flex: 1; padding: 30px 36px; min-height: 100vh; }
        .page-header { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 26px; flex-wrap: wrap; gap: 14px; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; color: var(--ali-dark);
            margin: 0; display: flex; align-items: center; gap: 10px; }
        .card-ali { background: #fff; border: none; border-radius: 14px;
            box-shadow: 0 2px 14px rgba(11,61,145,0.06); padding: 22px; }
        .stat-card { background: #fff; border-radius: 14px; padding: 20px;
            box-shadow: 0 2px 14px rgba(11,61,145,0.06);
            display: flex; align-items: center; gap: 16px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-icon { width: 54px; height: 54px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .stat-label { font-size: 0.82rem; color: #6b7280; margin: 0; }
        .stat-value { font-size: 1.7rem; font-weight: 700; color: var(--ali-dark); margin: 0; }
        .btn-ali { background: var(--ali-primary); color: #fff; border: none;
            padding: 10px 20px; border-radius: 9px; font-weight: 600; font-size: 0.9rem;
            transition: all 0.2s; display: inline-flex; align-items: center; gap: 7px;
            text-decoration: none; }
        .btn-ali:hover { background: var(--ali-secondary); color: #fff; }
        .btn-ali-outline { background: transparent; border: 1.5px solid var(--ali-primary);
            color: var(--ali-primary); padding: 9px 18px; border-radius: 9px;
            font-weight: 600; font-size: 0.9rem; display: inline-flex;
            align-items: center; gap: 7px; text-decoration: none; }
        .btn-ali-outline:hover { background: var(--ali-primary); color: #fff; }
        .badge-soft { padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-soft-success { background: #d1fae5; color: #065f46; }
        .badge-soft-danger  { background: #fee2e2; color: #991b1b; }
        .badge-soft-warning { background: #fef3c7; color: #92400e; }
        .badge-soft-info    { background: #dbeafe; color: #1e40af; }
        .badge-soft-secondary { background: #e5e7eb; color: #374151; }
        .oferta-card { background: #fff; border-radius: 14px;
            box-shadow: 0 2px 14px rgba(11,61,145,0.06); padding: 22px;
            height: 100%; display: flex; flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            border-top: 4px solid var(--ali-primary); }
        .oferta-card.inactiva { opacity: 0.65; border-top-color: #9ca3af; }
        .oferta-card:hover { transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(11,61,145,0.12); }
        .oferta-tipo { font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; color: var(--ali-accent); }
        .oferta-titulo { font-size: 1.15rem; font-weight: 700;
            color: var(--ali-dark); margin: 6px 0; }
        .oferta-desc { color: #6b7280; font-size: 0.88rem; flex: 1; }
        .oferta-meta { display: flex; gap: 16px; margin-top: 14px;
            padding-top: 14px; border-top: 1px solid #eef2f7;
            font-size: 0.8rem; color: #6b7280; }
        .form-label { font-weight: 600; color: var(--ali-dark); font-size: 0.9rem;
            margin-bottom: 6px; }
        .form-control, .form-select { border-radius: 9px;
            border: 1.5px solid #e2e8f0; padding: 10px 14px; font-size: 0.92rem; }
        .form-control:focus, .form-select:focus {
            border-color: var(--ali-primary);
            box-shadow: 0 0 0 3px rgba(11,61,145,0.1); }
        .help-text { font-size: 0.78rem; color: #94a3b8; margin-top: 4px; }
        .oferta-card-img { width: 100%; height: 150px; object-fit: cover;
            border-radius: 10px; margin-bottom: 12px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <a class="sidebar-brand" href="{% url 'emails:dashboard' %}">
            <i class="bi bi-truck"></i> Alitrans
        </a>
        <nav class="sidebar-nav">
            <a href="{% url 'emails:dashboard' %}"
               class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a href="{% url 'emails:lista_ofertas' %}"
               class="{% if 'oferta' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-tags-fill"></i> Ofertas
            </a>
            <a href="{% url 'emails:lista_envios' %}"
               class="{% if 'envio' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-send-fill"></i> Envíos
            </a>
            <a href="{% url 'emails:lista_destinatarios' %}"
               class="{% if 'destinatario' in request.resolver_match.url_name %}active{% endif %}">
                <i class="bi bi-people-fill"></i> Destinatarios
            </a>
            <a href="/admin/" target="_blank">
                <i class="bi bi-gear-fill"></i> Administración
            </a>
        </nav>
        <div class="sidebar-footer"><i class="bi bi-c-circle"></i> Alitrans 2025</div>
    </aside>

    <main class="main-content">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                     role="alert" style="border-radius:10px;">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
