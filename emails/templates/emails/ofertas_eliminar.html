{% extends 'emails/base.html' %}
{% block content %}
<div class="page-header">
    <h1><i class="bi bi-exclamation-triangle"></i> Eliminar oferta</h1>
</div>
<div class="card-ali text-center py-5" style="max-width:600px;margin:0 auto;">
    <i class="bi bi-trash" style="font-size:3.5rem;color:#ef4444;"></i>
    <h4 class="mt-3">¿Eliminar "{{ oferta.titulo }}"?</h4>
    <p class="text-muted">Esta acción no se puede deshacer.</p>
    <form method="post" class="d-flex justify-content-center gap-2 mt-3">
        {% csrf_token %}
        <button class="btn-ali" style="background:#ef4444;">
            <i class="bi bi-trash"></i> Sí, eliminar</button>
        <a href="{% url 'emails:lista_ofertas' %}" class="btn-ali-outline">Cancelar</a>
    </form>
</div>
{% endblock %}
